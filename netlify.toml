[build]
  command = "go run ./cmd/sitebuild"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api/healthz"
  status = 200

[functions."auction-refresh"]
  schedule = "30 4 * * *"
